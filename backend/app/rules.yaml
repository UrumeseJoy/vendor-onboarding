# Vendor onboarding rules.
# All business settings live here, so they can be reviewed and changed
# without touching code.

# Form fields a vendor MUST fill in, per country.
# "bank.xyz" means the field xyz inside the bank details section.
required_fields:
  IN: [legal_name, state, address, contact_email, pan, gstin, bank.holder_name, bank.account_number, bank.ifsc]
  US: [legal_name, state, address, contact_email, ein, bank.holder_name, bank.account_number, bank.routing_number]

# Documents a vendor MUST upload, per country.
# Each inner list is one requirement: at least ONE document type from that list must be present.
# Example: India needs a GST certificate, a PAN card, and (a cancelled cheque OR a bank letter).
required_documents:
  IN: [[GST_CERTIFICATE], [PAN_CARD], [CANCELLED_CHEQUE, BANK_LETTER]]
  US: [[W9_FORM], [BANK_LETTER]]

# How closely two company names must match (score 0-100).
# At or above pass_threshold: names match.
# Between warn_threshold and pass_threshold: warning, a person must look (vendor stays PENDING).
# Below warn_threshold: names do not match (REJECTED).
name_match:
  pass_threshold: 90
  warn_threshold: 75
  # Before comparing, names are lowercased, punctuation is removed, and these
  # short forms are replaced by their long forms (so "Pvt Ltd" equals "Private Limited").
  normalise:
    "pvt": "private"
    "ltd": "limited"
    "co": "company"
    "corp": "corporation"
    "inc": "incorporated"
    "llp": "limited liability partnership"
    "&": "and"

# How sure the document reader must be before we trust what it read (0 to 1).
# Anything below these levels is never trusted and the vendor is asked for a clearer document.
extraction:
  min_field_confidence: 0.80      # for each individual field
  min_document_confidence: 0.70   # for the document as a whole

# Risk signals. Each flag has a severity (HARD = reject, SOFT = needs follow-up)
# and a score added to the vendor's risk score (total capped at 100).
risk:
  # Email domains used by individuals rather than companies.
  free_email_domains: [gmail.com, yahoo.com, yahoo.co.in, hotmail.com, outlook.com, rediffmail.com, proton.me, icloud.com]
  # Weak signals add up: one alone does not block a vendor, but once the total risk score
  # reaches this number the vendor goes to a human reviewer (PENDING).
  review_threshold: 30
  flags:
    FREE_EMAIL_DOMAIN: {severity: SOFT, score: 15}        # contact email is a free personal address
    BANK_COUNTRY_MISMATCH: {severity: SOFT, score: 30}    # bank is in a different country than the company
    DUPLICATE_BANK_ACCOUNT: {severity: HARD, score: 100}  # same bank account already used by another vendor

# How serious it is when each check does not pass.
# HARD = a serious problem (the vendor is rejected, or flagged for rejection).
# SOFT = fixable (the vendor is put on hold, PENDING, and asked to correct it).
# A check with no entry here is an error, so nothing is ever treated as serious or minor by accident.
check_severity:
  DOC_READABLE: SOFT
  EXTRACTION_CONFIDENCE: SOFT
  REQUIRED_FIELDS: SOFT
  REQUIRED_DOCUMENTS: SOFT
  DOC_TYPE_MATCH: SOFT
  PAN_FORMAT: HARD
  GSTIN_FORMAT: HARD
  GSTIN_CHECKSUM: HARD
  IFSC_FORMAT: SOFT
  EIN_FORMAT: HARD
  ROUTING_FORMAT: SOFT
  PAN_IN_GSTIN: HARD
  GST_STATE_MATCH: SOFT
  BANK_NAME_MATCH: HARD
  DOC_FIELDS_MATCH: HARD
  FREE_EMAIL_DOMAIN: SOFT
  BANK_COUNTRY_MISMATCH: SOFT
  DUPLICATE_BANK_ACCOUNT: HARD

